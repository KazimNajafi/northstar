<VirtualHost *:80>
    ServerName northstar.local
    ServerAlias localhost
    DocumentRoot /var/www/northstar
    DirectoryIndex signin.php index.php

    <Directory /var/www/northstar>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/northstar/config>
        Require all denied
    </Directory>

    <Directory /var/www/northstar/docs>
        Require all denied
    </Directory>

    <Directory /var/www/northstar/apache>
        Require all denied
    </Directory>

    <Directory /var/www/northstar/tests>
        Require all denied
    </Directory>

    <Directory /var/www/northstar/.git>
        Require all denied
    </Directory>

    <FilesMatch "^(?:\.|schema\.sql$|README\.md$)">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    ErrorLog ${APACHE_LOG_DIR}/northstar_error.log
    CustomLog ${APACHE_LOG_DIR}/northstar_access.log combined
</VirtualHost>